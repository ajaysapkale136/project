
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-project-architect-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  storage:
    base-path: d:/project/storage
  ingestion:
    max-file-size-bytes: 157286400
    max-extracted-bytes: 524288000
    max-file-count: 50000
    max-compression-ratio: 100
  security:
    jwt:
      secret: ${JWT_SECRET_BASE64:dGhpc0lzQVZlcnlTZWN1cmVKd3RTZWNyZXRLZXlXaXRoMzJCeXRlc01pbmltdW1MZW5ndGg=}
      expiration: 3600000
    cors:
      allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
